// The meadow ramp, the app icon's light. Kept in step with LightField.swift / site/index.html.
const RAMP = [0x99909C, 0xB995C4, 0xA68CBB, 0x9E8CB4, 0xADA1B3, 0xC1BCC2, 0xD0CCCA, 0xD6D3CA, 0xD9D4C1, 0xD0C49F, 0xA49E59, 0x3E8039, 0x27A64A, 0x24B955, 0x168D47, 0x122B22];
function oklab(hex) {
  const lin = (b) => { const c = (b & 255) / 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const r = lin(hex >> 16), g = lin(hex >> 8), b = lin(hex);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
          1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
          0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s];
}
const VERT = `#version 300 es
void main(){vec2 p=vec2(gl_VertexID<<1&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}`;
const FRAG = `#version 300 es
precision highp float;
uniform vec2 uRes;      // block size in device pixels
uniform float uTime;
uniform float uScale;   // device pixels per point
uniform float uRadius;  // points
uniform vec3 uLut[16];  // OKLab
uniform vec4 uShape;    // turn, wrap, reading room, dark ink
uniform vec4 uFinish;   // edge light, grain, seed, eased throughout
out vec4 o;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
vec2 grad(vec2 i){float a=hash(i)*6.28318;return vec2(cos(a),sin(a));}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*f*(f*(f*6.-15.)+10.);
  return mix(mix(dot(grad(i),f),dot(grad(i+vec2(1.,0.)),f-vec2(1.,0.)),u.x),
             mix(dot(grad(i+vec2(0.,1.)),f-vec2(0.,1.)),dot(grad(i+vec2(1.,1.)),f-vec2(1.,1.)),u.x),u.y);}
vec3 lut(float s){float f=clamp(s,0.,1.)*15.;int i=int(min(floor(f),14.));float u=f-float(i);
  vec3 a=uLut[max(i-1,0)],b=uLut[i],c=uLut[i+1],d=uLut[min(i+2,15)];
  return .5*((2.*b)+(c-a)*u+(2.*a-5.*b+4.*c-d)*u*u+(3.*b-a-3.*c+d)*u*u*u);}
vec3 srgb(vec3 c){

void main(){
  vec2 size=uRes/uScale;
