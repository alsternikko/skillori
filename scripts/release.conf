# Skillori's release settings, read by scripts/release.sh. The Apple ID, keychain service and
# team id for notarization stay in scripts/notarize.conf.local, which is never committed.

# The folder visitors download from, through Dropbox. The file keeps its name, so its link never
# changes: the script writes into it instead of deleting it.
DROPBOX_DIR="$HOME/Library/CloudStorage/Dropbox/Skillori"
DMG_NAME="Skillori.dmg"

# Dropbox's direct link to Skillori.dmg. It stays the same as long as the file is replaced under
# the same name; a file deleted and uploaded again gets a new link. Empty until the first release
# has put the file in Dropbox. Set it with:
#
#   sh scripts/release.sh --link "<the link from Copy Dropbox link>"
#
# which also writes it into site/api/download.mjs, so the two never differ.
DMG_URL="https://dl.dropboxusercontent.com/scl/fi/5a712jyr61keg4ii1wszr/Skillori.dmg?rlkey=6mjshiwn0xvhkh8mfcdivcrwa&dl=1"

# The address the download buttons lead to (they say /download, and Vercel adds the slash). It
# counts the download and sends it on to DMG_URL (site/api/download.mjs).
DMG_LINK="https://skillori.app/download/"

# The site's own repository, a clone of alsternikko/skillori-site. Vercel serves its site/
# folder at skillori.app. Next to this repository unless set here.
# SITE_REPO="$HOME/My-projects/skillori-site"
