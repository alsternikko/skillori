<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skillori changelog</title>
<meta name="description" content="What each version of Skillori brought with it, newest first.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Skillori changelog">
<meta property="og:description" content="What each version of Skillori brought with it, newest first.">
<meta property="og:url" content="https://skillori.app/changelog/">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Inter";src:url(/fonts/inter.woff2) format("woff2");font-weight:400 500;font-display:swap}
@font-face{font-family:"Geist Mono";src:url(/fonts/geist-mono.woff2) format("woff2");font-weight:400 500;font-display:swap}
/* The same tokens as the launch page (site/index.html). */
:root{
  --ground:#E6E6E8;--panel:#F1F1F3;--card:#FAFAFB;
  --ink:#151516;--ink2:#6B6B70;--ink3:#A3A3A8;--on-ink:#FFFFFF;
  --line:rgba(21,21,22,.1);--frame:rgba(21,21,22,.32);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono","Inter",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0E0E0F;--panel:#19191B;--card:#242427;
    --ink:#F1F1F3;--ink2:#A3A3A8;--ink3:#6B6B70;--on-ink:#151516;
    --line:rgba(241,241,243,.1);--frame:rgba(241,241,243,.32);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
svg{display:block}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-size:10.5px;line-height:13px;letter-spacing:.06em;text-transform:uppercase}

.top{display:flex;align-items:center;justify-content:space-between;height:76px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:20px;height:20px}
.brand span{font:500 16px/1 var(--sans);letter-spacing:-.012em}
.btn{display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 14px;border-radius:6px;background:var(--ink);color:var(--on-ink);font:500 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;transition:opacity .12s ease-out,transform .12s ease-out}
.btn svg{width:14px;height:14px;flex:none}
.btn:hover{opacity:.86}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.brand:focus-visible,.foot a:focus-visible,.rel h2 a:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}

.head{padding:30px 0 40px}
.eyebrow{color:var(--ink2)}
h1{margin:16px 0 0;font:400 clamp(40px,6.3vw,70px)/1.01 var(--sans);letter-spacing:-.045em}
.lede{margin:18px 0 0;max-width:30em;font-size:17px;line-height:1.5;color:var(--ink2);text-wrap:pretty}

/* One release per row: the version and its date on the left, what changed on the right. */
.list{background:var(--card);border-radius:16px;padding:6px 28px}
.rel{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 40px;padding:22px 0;border-top:1px solid var(--line);scroll-margin-top:24px}
.rel:first-child{border-top:0}
.rel h2{margin:0;font:500 13px/20px var(--mono);letter-spacing:.04em}
.rel h2 a:hover{color:var(--ink2)}
.rel time{display:block;margin-top:2px;color:var(--ink2)}
.rel p{margin:0;max-width:38em;font-size:15.5px;line-height:1.55;text-wrap:pretty}
.rel.is-latest h2::after{content:"Latest";margin-left:10px;padding:3px 7px;border-radius:4px;background:#F1C8F0;color:#151516;font:400 9.5px/13px var(--mono);letter-spacing:.06em;text-transform:uppercase;vertical-align:1px}
.none p{color:var(--ink2)}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 18px;padding:30px 0 60px;color:var(--ink2)}
.foot a:hover{color:var(--ink)}

@media (max-width:640px){
  .list{padding:4px 18px}
  .rel{grid-template-columns:1fr;gap:10px}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="brand" href="/" aria-label="Skillori, back to the start page">
      <svg aria-hidden="true"><use href="#mark" fill="currentColor"/></svg>
      <span>Skillori</span>
    </a>
    <a class="btn" href="/download"><svg aria-hidden="true"><use href="#i-down"/></svg>Download</a>
  </header>

  <main>
    <section class="head">
      <div class="eyebrow mono">Changelog</div>
      <h1>What’s new</h1>
      <p class="lede">Every version of Skillori and what it brought along, newest first. The download button always hands you the latest one.</p>
    </section>

    <section class="list" aria-label="Versions">
      <!-- scripts/release.sh adds each version here, newest first. -->
      <article class="rel none" id="none">
        <h2>Coming soon</h2>
        <p>Nothing has shipped yet. The first version is on its way.</p>
      </article>
    </section>
  </main>

  <footer class="foot mono">
    <span>© 2026 Skillori</span>
    <a href="/">Back to Skillori</a>
  </footer>
