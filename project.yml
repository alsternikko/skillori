# XcodeGen spec. Generate the project with: xcodegen generate
# The .xcodeproj is generated output and not committed.
name: Skillori
options:
  bundleIdPrefix: com.niklaskarlsson
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  SkilloriCore:
    path: Packages/SkilloriCore
  SkilloriUI:
    path: Packages/SkilloriUI
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 9N465MGNW2
targets:
  Skillori:
    type: application
    platform: macOS
    sources:
      - App/Skillori
    dependencies:
      - package: SkilloriCore
      - package: SkilloriUI
    info:
      path: App/Skillori/Info.plist
      properties:
        CFBundleDisplayName: Skillori
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niklaskarlsson.skillori
        PRODUCT_NAME: Skillori
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Release:
          # Notarization rejects builds that carry the debugger entitlement get-task-allow.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
