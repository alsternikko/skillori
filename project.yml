# XcodeGen spec. Generate the project with: xcodegen generate
# The .xcodeproj is generated output and not committed.
name: Skillwatch
options:
  bundleIdPrefix: com.niklaskarlsson
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  SkillwatchCore:
    path: Packages/SkillwatchCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 9N465MGNW2
targets:
  Skillwatch:
    type: application
    platform: macOS
    sources:
      - App/Skillwatch
    dependencies:
      - package: SkillwatchCore
    info:
      path: App/Skillwatch/Info.plist
      properties:
        CFBundleDisplayName: Skillwatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niklaskarlsson.skillwatch
        PRODUCT_NAME: Skillwatch
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Release:
          # Notarization rejects builds that carry the debugger entitlement get-task-allow.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
