# XcodeGen spec. Generate the project with: xcodegen generate
# The .xcodeproj is generated output and not committed.
name: Skillori
options:
  bundleIdPrefix: com.niklaskarlsson
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  SkilloriCore:
    path: Packages/SkilloriCore
  SkilloriUI:
    path: Packages/SkilloriUI
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Skillori:
    type: application
    platform: macOS
    sources:
      - App/Skillori
    dependencies:
      - package: SkilloriCore
      - package: SkilloriUI
    # Signing lives in Config/Signing.xcconfig so a clone builds without an Apple account.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: App/Skillori/Info.plist
      properties:
        CFBundleDisplayName: Skillori
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_NAME: Skillori
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Release:
          # Notarization rejects builds that carry the debugger entitlement get-task-allow.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
