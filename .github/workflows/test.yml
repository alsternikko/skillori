name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: SkilloriCore tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Run tests
        run: swift test --package-path Packages/SkilloriCore
